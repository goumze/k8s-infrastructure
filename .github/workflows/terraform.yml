name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan

    #Reapplying Terraform changes after CW
    # - name: Terraform Apply
    #   if: github.ref == 'refs/heads/main'
    #   run: terraform apply -auto-approve

    #Run destroy pipeline, for the main branch
    # Destroy node groups first to avoid ResourceInUseException
    # Must target specific node group key "green" due to for_each in EKS module
    - name: Terraform Destroy Node Groups
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -target='module.eks.aws_eks_node_group.this["green"]' -auto-approve
      continue-on-error: true
    
    # Force delete node groups via AWS CLI if they still exist
    - name: Force Delete Node Groups via AWS CLI
      if: github.ref == 'refs/heads/main'
      run: |
        set +e
        CLUSTER_NAME="k8s-agentic-ai-cluster"
        echo "Checking for node groups in cluster: $CLUSTER_NAME"
        
        # List all node groups
        NODE_GROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER_NAME" --query 'nodegroups[]' --output text 2>/dev/null)
        
        if [ -n "$NODE_GROUPS" ] && [ "$NODE_GROUPS" != "None" ]; then
          echo "Found node groups: $NODE_GROUPS"
          for ng in $NODE_GROUPS; do
            echo "Deleting node group: $ng"
            aws eks delete-nodegroup --cluster-name "$CLUSTER_NAME" --nodegroup-name "$ng" 2>/dev/null || true
          done
          echo "Node groups deletion initiated via AWS CLI"
        else
          echo "No node groups found"
        fi
        set -e
      continue-on-error: true
    
    # Wait for EC2 instances to terminate (3 minutes)
    - name: Wait for EC2 Instances to Terminate
      if: github.ref == 'refs/heads/main'
      run: sleep 180
    
    # Terminate any remaining EC2 instances
    - name: Force Terminate Remaining EC2 Instances
      if: github.ref == 'refs/heads/main'
      run: |
        set +e
        VPC_ID=$(terraform output -raw vpc_id 2>/dev/null)
        if [ -n "$VPC_ID" ]; then
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text 2>/dev/null)
          if [ -n "$INSTANCE_IDS" ]; then
            echo "Terminating instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS 2>/dev/null || true
            sleep 60
          fi
        fi
        set -e
      continue-on-error: true
    
    # Verify node groups are deleted before destroying cluster
    - name: Verify Node Groups Deleted
      if: github.ref == 'refs/heads/main'
      run: |
        set +e
        CLUSTER_NAME="k8s-agentic-ai-cluster"
        max_attempts=10
        attempt=0
        
        while [ $attempt -lt $max_attempts ]; do
          NODE_GROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER_NAME" --query 'nodegroups[]' --output text 2>/dev/null)
          if [ -z "$NODE_GROUPS" ] || [ "$NODE_GROUPS" = "None" ]; then
            echo "✓ All node groups have been deleted successfully"
            exit 0
          fi
          echo "Attempt $((attempt+1))/$max_attempts: Node groups still exist: $NODE_GROUPS"
          sleep 30
          attempt=$((attempt+1))
        done
        
        echo "⚠ Warning: Node groups still exist after waiting, proceeding with terraform destroy anyway"
        set -e
      continue-on-error: true
    
    # Then destroy all remaining resources
    - name: Terraform Destroy All Resources
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -auto-approve
      continue-on-error: true
    
    # Final cleanup - force detach IGW if needed
    - name: Force Cleanup Internet Gateway
      if: github.ref == 'refs/heads/main'
      run: |
        set +e
        VPC_ID=$(terraform output -raw vpc_id 2>/dev/null)
        if [ -n "$VPC_ID" ]; then
          echo "VPC ID: $VPC_ID"
          IGW_ID=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[0].InternetGatewayId' \
            --output text 2>/dev/null)
          if [ -n "$IGW_ID" ] && [ "$IGW_ID" != "None" ]; then
            echo "Detaching IGW: $IGW_ID from VPC: $VPC_ID"
            aws ec2 detach-internet-gateway --internet-gateway-id "$IGW_ID" --vpc-id "$VPC_ID" 2>/dev/null || true
            sleep 30
            echo "Deleting IGW: $IGW_ID"
            aws ec2 delete-internet-gateway --internet-gateway-id "$IGW_ID" 2>/dev/null || true
          fi
        fi
        set -e
      continue-on-error: true