name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan

    #Reapplying Terraform changes after CW
    # - name: Terraform Apply
    #   if: github.ref == 'refs/heads/main'
    #   run: terraform apply -auto-approve

    #Run destroy pipeline, for the main branch
    # Destroy node groups first to avoid ResourceInUseException
    - name: Terraform Destroy Node Groups
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -target='module.eks.aws_eks_node_group.this' -auto-approve
      continue-on-error: true
    
    # Wait for EC2 instances to terminate (3 minutes)
    - name: Wait for EC2 Instances to Terminate
      if: github.ref == 'refs/heads/main'
      run: sleep 180
    
    # Terminate any remaining EC2 instances
    - name: Force Terminate Remaining EC2 Instances
      if: github.ref == 'refs/heads/main'
      run: |
        VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
        if [ ! -z "$VPC_ID" ]; then
          INSTANCE_IDS=$(aws ec2 describe-instances --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ ! -z "$INSTANCE_IDS" ]; then
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            sleep 60
          fi
        fi
      continue-on-error: true
    
    # Then destroy all remaining resources
    - name: Terraform Destroy All Resources
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -auto-approve
      continue-on-error: true
    
    # Final cleanup - force detach IGW if needed
    - name: Force Cleanup Internet Gateway
      if: github.ref == 'refs/heads/main'
      run: |
        VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
        if [ ! -z "$VPC_ID" ]; then
          IGW_ID=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query 'InternetGateways[0].InternetGatewayId' --output text)
          if [ ! -z "$IGW_ID" ] && [ "$IGW_ID" != "None" ]; then
            aws ec2 detach-internet-gateway --internet-gateway-id $IGW_ID --vpc-id $VPC_ID 2>/dev/null || true
            aws ec2 delete-internet-gateway --internet-gateway-id $IGW_ID 2>/dev/null || true
          fi
        fi
      continue-on-error: true