name: Terraform

on:
  push:
    branches:
      - feature/aws_eks_cluster_acks_kro
    paths:
      - "main/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the generated Terraform plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/aws_eks_cluster_acks_kro'
    defaults:
      run:
        working-directory: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan

      #recommit
      # - name: Apply Terraform plan
      #   run: terraform apply -input=false -auto-approve tfplan

      - name: Apply Terraform destroy
        run: terraform destroy -input=false -auto-approve
