name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -out=tfplan

    # - name: Terraform Apply
    #   if: github.ref == 'refs/heads/main'
    #   run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -auto-approve

    - name: Get Cluster Information
      if: github.ref == 'refs/heads/main'
      run: |
        # Already in k8s-infrastructure directory from terraform init
        
        # Disable terraform logging
        export TF_LOG=""
        export TF_LOG_PATH=""
        export TF_INPUT=false
        
        # Get JSON output directly without sed filtering
        echo "Retrieving terraform outputs..."
        OUTPUTS=$(terraform output -json 2>&1)
        
        # Show raw output for debugging
        echo "Raw terraform output:"
        echo "$OUTPUTS" | head -c 200
        echo ""
        echo ""
        
        # Validate JSON with better error handling
        if ! echo "$OUTPUTS" | jq empty 2>&1; then
          echo "❌ terraform output is not valid JSON"
          echo "Full output:"
          echo "$OUTPUTS"
          exit 1
        fi
        
        # Extract cluster name and suffix safely using jq
        CLUSTER_NAME=$(echo "$OUTPUTS" | jq -r '.cluster_name.value // empty' 2>&1)
        CLUSTER_SUFFIX=$(echo "$OUTPUTS" | jq -r '.cluster_suffix.value // empty' 2>&1)
        
        # Validate extraction
        if [ -z "$CLUSTER_NAME" ] || [ "$CLUSTER_NAME" == "null" ]; then
          echo "❌ Failed to extract cluster_name from terraform output"
          echo "Available keys:"
          echo "$OUTPUTS" | jq 'keys' 2>&1
          exit 1
        fi
        
        # Write outputs
        echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        echo "cluster_suffix=$CLUSTER_SUFFIX" >> $GITHUB_OUTPUT
        
        echo "✅ Cluster Name: $CLUSTER_NAME"
        echo "✅ Cluster Suffix: $CLUSTER_SUFFIX"

    - name: Display Cluster Information
      if: github.ref == 'refs/heads/main'
      run: |
        # Already in k8s-infrastructure directory from terraform init
        echo "=== EKS Cluster Information ==="
        echo "Cluster Name: $(terraform output -raw cluster_name 2>/dev/null || echo 'N/A')"
        echo "Cluster Endpoint: $(terraform output -raw cluster_endpoint 2>/dev/null || echo 'N/A')"
        echo "Cluster Version: $(terraform output -raw cluster_version 2>/dev/null || echo 'N/A')"
        echo "Region: ap-south-1"
        echo ""
        echo "Configure kubectl with:"
        terraform output -raw configure_kubectl
    
    # Cleanup terraform plan file
    - name: Cleanup
      if: always()
      run: rm -f tfplan