name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -out=tfplan

    # - name: Terraform Apply
    #   if: github.ref == 'refs/heads/main'
    #   run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: github.ref == 'refs/heads/main'
      run: terraform destroy -auto-approve

    - name: Get Cluster Information
      if: github.ref == 'refs/heads/main'
      run: |
        # Disable terraform logging
        export TF_LOG=""
        export TF_LOG_PATH=""
        export TF_INPUT=false
        
        echo "=== Extracting Terraform Outputs ==="
        
        # Extract outputs directly without JSON validation
        # Using -raw to get simple string values
        CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "")
        CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint 2>/dev/null || echo "")
        CLUSTER_VERSION=$(terraform output -raw cluster_version 2>/dev/null || echo "")
        CLUSTER_ARN=$(terraform output -raw cluster_arn 2>/dev/null || echo "")
        
        # Display extracted values
        echo "Cluster Name: ${CLUSTER_NAME:-'N/A'}"
        echo "Cluster Endpoint: ${CLUSTER_ENDPOINT:-'N/A'}"
        echo "Cluster Version: ${CLUSTER_VERSION:-'N/A'}"
        echo "Cluster ARN: ${CLUSTER_ARN:-'N/A'}"
        echo ""
        
        # Write to GITHUB_OUTPUT if values exist
        if [ -n "$CLUSTER_NAME" ]; then
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        fi
        
        if [ -n "$CLUSTER_ENDPOINT" ]; then
          echo "cluster_endpoint=$CLUSTER_ENDPOINT" >> $GITHUB_OUTPUT
        fi
        
        echo "✅ All outputs extracted successfully"

    - name: Display Cluster Information
      if: github.ref == 'refs/heads/main'
      run: |
        # Already in k8s-infrastructure directory from terraform init
        echo "=== EKS Cluster Information ==="
        echo "Cluster Name: $(terraform output -raw cluster_name 2>/dev/null || echo 'N/A')"
        echo "Cluster Endpoint: $(terraform output -raw cluster_endpoint 2>/dev/null || echo 'N/A')"
        echo "Cluster Version: $(terraform output -raw cluster_version 2>/dev/null || echo 'N/A')"
        echo "Region: ap-south-1"
        echo ""
        echo "Configure kubectl with:"
        terraform output -raw configure_kubectl
    
    # Cleanup terraform plan file
    - name: Cleanup
      if: always()
      run: rm -f tfplan