name: Terraform

on:
  push:
    branches:
      - feature/aws_eks_cluster_acks_kro
    paths:
      - "main/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the generated Terraform plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_enable_argocd_identity: ${{ vars.ENABLE_ARGOCD_IDENTITY || 'true' }}
  TF_VAR_enable_managed_argocd: ${{ vars.ENABLE_MANAGED_ARGOCD || 'true' }}
  TF_VAR_self_managed_argocd_paused: ${{ vars.SELF_MANAGED_ARGOCD_PAUSED || 'true' }}

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/aws_eks_cluster_acks_kro'
    defaults:
      run:
        working-directory: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # The cluster uses API auth mode, so the CI identity needs an EKS access entry
      # (created via ci_principal_arn) before the kubernetes/helm providers can authenticate.
      - name: Export CI principal ARN
        env:
          CI_PRINCIPAL_ARN: ${{ vars.CI_PRINCIPAL_ARN }}
        run: |
          if [ -n "$CI_PRINCIPAL_ARN" ]; then
            echo "TF_VAR_ci_principal_arn=$CI_PRINCIPAL_ARN" >> "$GITHUB_ENV"
          fi

      # Builds the Argo CD Identity Center admin object from repo variables (jq handles quoting).
      - name: Export Argo CD admin details
        env:
          ADMIN_USER_NAME: ${{ vars.ARGOCD_ADMIN_USER_NAME }}
          ADMIN_DISPLAY_NAME: ${{ vars.ARGOCD_ADMIN_DISPLAY_NAME }}
          ADMIN_GIVEN_NAME: ${{ vars.ARGOCD_ADMIN_GIVEN_NAME }}
          ADMIN_FAMILY_NAME: ${{ vars.ARGOCD_ADMIN_FAMILY_NAME }}
          ADMIN_EMAIL: ${{ vars.ARGOCD_ADMIN_EMAIL }}
        run: |
          if [ -z "$ADMIN_USER_NAME" ] || [ -z "$ADMIN_DISPLAY_NAME" ] || [ -z "$ADMIN_GIVEN_NAME" ] || [ -z "$ADMIN_FAMILY_NAME" ] || [ -z "$ADMIN_EMAIL" ]; then
            echo "::error::Set the ARGOCD_ADMIN_USER_NAME, ARGOCD_ADMIN_DISPLAY_NAME, ARGOCD_ADMIN_GIVEN_NAME, ARGOCD_ADMIN_FAMILY_NAME and ARGOCD_ADMIN_EMAIL repository variables (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          ADMIN=$(jq -cn \
            --arg u "$ADMIN_USER_NAME" --arg d "$ADMIN_DISPLAY_NAME" \
            --arg g "$ADMIN_GIVEN_NAME" --arg f "$ADMIN_FAMILY_NAME" --arg e "$ADMIN_EMAIL" \
            '{user_name: $u, display_name: $d, given_name: $g, family_name: $f, email: $e}')
          echo "TF_VAR_argocd_identity_admin=$ADMIN" >> "$GITHUB_ENV"

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan

      #recommit comment again
      # - name: Apply Terraform plan
      #   run: terraform apply -input=false -auto-approve tfplan

      ##Commenting for destroy
      - name: Apply Terraform destroy
        run: terraform destroy -input=false -auto-approve
